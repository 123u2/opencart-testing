# OpenCart 电商系统自动化测试 CI 流水线
#代码推送自动触发 API 测试 + UI 测试，生成 Allure 报告
name: OpenCart E-commerce Testing CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # 允许手动触发
  workflow_dispatch:

jobs:
  # ═══ Job 1: API 接口自动化测试 ═══
  api-tests:
    runs-on: ubuntu-latest
    name: API Tests

    services:
      # 启动 OpenCart + MariaDB 服务容器
      opencart:
        image: bitnami/opencart:latest
        ports:
          - 8080:8080
        env:
          OPENCART_HOST: localhost
          OPENCART_DATABASE_HOST: mariadb
          OPENCART_DATABASE_NAME: bitnami_opencart
          OPENCART_DATABASE_USER: bn_opencart
          OPENCART_DATABASE_PASSWORD: bitnami
        options: >-
          --health-cmd "curl -f http://localhost:8080 || exit 1"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 10

      mariadb:
        image: mariadb:10.11
        ports:
          - 3306:3306
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: bitnami_opencart
          MARIADB_USER: bn_opencart
          MARIADB_PASSWORD: bitnami

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Wait for OpenCart
        run: |
          echo "等待 OpenCart 启动..."
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:8080 | grep -q "200\|302"; then
              echo "OpenCart 已就绪!"
              break
            fi
            echo "等待中... ($i/30)"
            sleep 10
          done

      - name: Run API Tests
        env:
          OPENCART_BASE_URL: http://localhost:8080
          DB_HOST: localhost
          DB_PORT: 3306
        run: |
          pytest api_tests/ -v --alluredir=reports/allure-results || true

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: reports/allure-results

  # ═══ Job 2: UI 自动化测试 ═══
  ui-tests:
    runs-on: ubuntu-latest
    name: UI Tests
    needs: api-tests  # 等 API 测试通过后再跑

    services:
      opencart:
        image: bitnami/opencart:latest
        ports:
          - 8080:8080
        env:
          OPENCART_HOST: localhost
          OPENCART_DATABASE_HOST: mariadb
          OPENCART_DATABASE_NAME: bitnami_opencart
          OPENCART_DATABASE_USER: bn_opencart
          OPENCART_DATABASE_PASSWORD: bitnami
        options: >-
          --health-cmd "curl -f http://localhost:8080 || exit 1"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 10

      mariadb:
        image: mariadb:10.11
        ports:
          - 3306:3306
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: bitnami_opencart
          MARIADB_USER: bn_opencart
          MARIADB_PASSWORD: bitnami

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Wait for OpenCart
        run: |
          echo "等待 OpenCart 启动..."
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:8080 | grep -q "200\|302"; then
              echo "OpenCart 已就绪!"
              break
            fi
            echo "等待中... ($i/30)"
            sleep 10
          done

      - name: Run UI Smoke Tests (Headless Chrome)
        env:
          OPENCART_BASE_URL: http://localhost:8080
        run: |
          pytest ui_tests/ -v --browser=chrome-headless -m smoke || true

  # ═══ Job 3: Python 代码风格检查 ═══
  lint:
    runs-on: ubuntu-latest
    name: Code Lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff
      - run: ruff check . --ignore=E501,F841
