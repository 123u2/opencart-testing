[pytest]
# 测试路径
testpaths = api_tests ui_tests

# 命令行参数
addopts =
    -v
    --tb=short
    --strict-markers
    --alluredir=reports/allure-results

# 自定义标记
markers =
    smoke: 冒烟测试 — 核心功能快速验证（每次提交必跑）
    regression: 回归测试 — 全量功能验证（发版前跑）
    p0: 优先级 P0 — 阻塞级缺陷相关（核心链路中断）
    p1: 优先级 P1 — 严重缺陷相关（功能不可用但有替代方案）
    slow: 耗时较长的测试（标记以支持跳过）
    auth: 认证模块相关测试
    cart: 购物车模块相关测试
    checkout: 结账流程相关测试
    e2e: 端到端流程测试

# 日志
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %H:%M:%S
